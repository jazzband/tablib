[tox]
usedevelop = true
requires =
    tox>=4.32
env_list =
    docs
    lint
    py{310-315}

[testenv]
deps =
    -rtests/requirements.txt
commands_pre =
    - {envpython} -m pip install --only-binary :all: pandas
pass_env =
    FORCE_COLOR
commands =
    pytest {posargs:tests}

[testenv:docs]
deps =
    sphinx
commands =
    sphinx-build -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html

[testenv:lint]
deps =
    pre-commit
    build
    twine
commands =
    pre-commit run --all-files
    python -m build
    twine check dist/*
skip_install = true
